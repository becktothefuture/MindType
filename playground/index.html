<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind⠶Flow v0.6 - Revolutionary Typing Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Geist', system-ui, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            color: #0f172a;
            line-height: 1.6;
        }
        
        .header {
            text-align: center;
            padding: 4rem 2rem 3rem 2rem;
            background: linear-gradient(135deg, rgba(60, 197, 204, 0.03) 0%, rgba(60, 197, 204, 0.08) 100%);
            border-bottom: 1px solid rgba(60, 197, 204, 0.1);
            backdrop-filter: blur(20px);
        }
        
        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin: 0 0 1rem 0;
            font-weight: 700;
            background: linear-gradient(135deg, #0f172a 0%, #3cc5cc 50%, #0f172a 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            font-size: 1.25rem;
            color: #64748b;
            margin: 0;
            font-weight: 400;
        }
        
        .main {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 3rem;
            align-items: start;
            padding: 3rem 2rem;
        }
        
        .editor-container {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .active-region-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
            font-family: 'Geist Mono', Monaco, monospace;
            font-size: 1rem;
            line-height: 1.8;
            padding: 2rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: transparent;
            background: transparent;
            border: none;
            outline: none;
            border-radius: 20px;
        }
        
        .active-region-highlight {
            background: rgba(59, 130, 246, 0.15);
            border-radius: 6px;
            padding: 2px 4px;
            margin: -2px -4px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
            animation: activeRegionPulse 2s ease-in-out infinite;
        }
        
        @keyframes activeRegionPulse {
            0%, 100% { 
                background: rgba(59, 130, 246, 0.15);
                border-color: rgba(59, 130, 246, 0.3);
            }
            50% { 
                background: rgba(59, 130, 246, 0.25);
                border-color: rgba(59, 130, 246, 0.5);
            }
        }
        
        .editor {
            width: 100%;
            height: 400px;
            padding: 2rem;
            border: none;
            border-radius: 20px;
            font-family: 'Geist Mono', Monaco, monospace;
            font-size: 1rem;
            line-height: 1.8;
            resize: none;
            background: transparent;
            color: #1e293b;
            outline: none;
            z-index: 2;
            position: relative;
        }
        
        /* v0.6: Native marker - no overlay needed, marker is part of text */
        
        .controls {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 2rem;
        }
        
        .controls h3 {
            font-family: 'Geist', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 2rem 0;
            color: #1e293b;
        }
        
        .control-group {
            margin-bottom: 2rem;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 500;
            color: #475569;
            font-size: 0.95rem;
        }
        
        .status {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.2) 100%);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            font-family: 'Geist Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            color: #166534;
            margin-bottom: 2rem;
        }
        
        .correction-log {
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Geist Mono', monospace;
            font-size: 0.85rem;
            margin-top: 2rem;
        }
        
        .correction-log h4 {
            margin: 0 0 1rem 0;
            font-family: 'Geist', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
        }
        
        .log-entry {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(226, 232, 240, 0.3);
            color: #059669;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .pipeline-status {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .stage-status {
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .stage-noise { background: rgba(239, 68, 68, 0.1); color: #dc2626; }
        .stage-context { background: rgba(59, 130, 246, 0.1); color: #2563eb; }
        .stage-tone { background: rgba(168, 85, 247, 0.1); color: #9333ea; }
        
        
        @media (prefers-reduced-motion: reduce) {
            .active-region, .correction-marker { transition: none !important; animation: none !important; }
        }
        
        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; gap: 2rem; }
            .header { padding: 2rem 1rem; }
            .controls { position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mind⠶Flow v0.6</h1>
        <p>Revolutionary Typing Intelligence • Live Corrections • Correction Marker</p>
    </div>
    
      <div class="main">
          <div class="editor-container">
             <textarea 
                 id="editor" 
                 class="editor" 
                 placeholder="Start typing to see the native Correction Marker travel through your text..."
                 spellcheck="false">Hello wrold! This is a tset of the Mind⠶Flow correction systm. Try typing with some typos and watch the Correction Marker travel through your text, applying corrections behind your cursor. Doe you think this wil wrk? Yeahs this ios cool ol dont knzo rwhat the best approahc is.</textarea>
             <div id="activeRegionOverlay" class="active-region-overlay"></div>
          </div>
        
        <div class="controls">
            <h3>Live Correction Controls</h3>
            
            <div id="status" class="status">
                Ready for corrections...
            </div>
            
            <div class="control-group">
                <label>Active Region Size: <span id="regionValue">20</span> words</label>
                <input type="range" id="regionSize" min="5" max="50" value="20" 
                       style="width: 100%; accent-color: #3cc5cc;">
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-top: 0.5rem;">
                    <span>5</span><span>50</span>
                </div>
            </div>
            
            <div class="control-group">
                <label>Marker Animation Speed: <span id="animationSpeedValue">80</span>ms</label>
                <input type="range" id="animationSpeed" min="10" max="200" value="80" step="10"
                       style="width: 100%; accent-color: #3cc5cc;">
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-top: 0.5rem;">
                    <span>Fast (10ms)</span><span>Slow (200ms)</span>
                </div>
            </div>
            
            
            <div class="pipeline-status">
                <div class="stage-status stage-noise" id="noiseStatus">NOISE<br>Ready</div>
                <div class="stage-status stage-context" id="contextStatus">CONTEXT<br>Ready</div>
                <div class="stage-status stage-tone" id="toneStatus">TONE<br>None</div>
            </div>
            
            <div class="correction-log">
                <h4>Correction Log</h4>
                <div id="correctionLog">Ready for corrections...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        // v0.6 LM-Only Correction Pipeline (QWEN Model Integration)
        // Based on: docs/06-guides/06-03-reference/three-stage-pipeline.md
        // Based on: docs/05-adr/0006-lm-only-rollback.md
        
        // Using LM worker (Transformers.js runs inside worker)
        
        // DOM elements
        const editor = document.getElementById('editor');
        const status = document.getElementById('status');
        const regionSlider = document.getElementById('regionSize');
        const regionValue = document.getElementById('regionValue');
        const animationSpeedSlider = document.getElementById('animationSpeed');
        const animationSpeedValue = document.getElementById('animationSpeedValue');
        // Removed currentMarkerDisplay - not needed
        // Marker symbol buttons removed - auto-cycling through symbols
        const correctionLog = document.getElementById('correctionLog');
        const noiseStatus = document.getElementById('noiseStatus');
        const contextStatus = document.getElementById('contextStatus');
        const toneStatus = document.getElementById('toneStatus');
        
        // State
        let activeRegionWords = 20;
        let isProcessing = false;
        let typingTimer = null;
        let lastCaret = 0;
        let lmReady = false;
        let originalText = ''; // Store original text for marker behavior
        let userCaretPosition = 0; // Store user's original caret position - STAYS FIXED
        
        // Marker animation settings (configurable via controls)
        let markerAnimationFrame;
        let currentMarkerIndex = 0;
        let animationSpeed = 80; // Default 80ms per step
        const markerSymbols = ['⠀', '⠂', '⠄', '⠆', '⠐', '⠒', '⠔', '⠖', '⠠', '⠢', '⠤', '⠦', '⠰', '⠲', '⠴', '⠶'];
        let currentMarkerSymbol = markerSymbols[0]; // Start with first symbol
        
        // v0.6 Active Region Policy Implementation
        // Based on: docs/05-adr/0006-lm-only-rollback.md (Single Active Region, 20 words default, burst growth)
        function computeActiveRegion(text, caret, burstState = null) {
            const words = text.slice(0, caret).split(/\s+/).filter(w => w.length > 0);
            let maxWords = activeRegionWords;
            
            // Burst growth logic: expand during typing bursts (ADR-0006)
            if (burstState && burstState.keyCount > 5 && burstState.timeSinceLastKey < 200) {
                maxWords = Math.min(Math.floor(maxWords * 1.5), 50); // Up to 1.5x during bursts
            }
            
            const takeWords = Math.min(maxWords, words.length);
            if (takeWords === 0) return { start: caret, end: caret };
            
            const activeWords = words.slice(-takeWords);
            const activeText = activeWords.join(' ');
            const start = Math.max(0, text.lastIndexOf(activeText, caret));
            const end = caret;
            
            // Grapheme-safe boundaries (prevent splitting emoji/combining chars)
            return alignToGraphemeBoundaries(text, start, end);
        }
        
        function alignToGraphemeBoundaries(text, start, end) {
            // Simple grapheme safety - avoid splitting on combining marks
            while (start > 0 && /[\u0300-\u036F\u1AB0-\u1AFF\u1DC0-\u1DFF\u20D0-\u20FF]/.test(text[start])) {
                start--;
            }
            while (end < text.length && /[\u0300-\u036F\u1AB0-\u1AFF\u1DC0-\u1DFF\u20D0-\u20FF]/.test(text[end])) {
                end++;
            }
            return { start, end };
        }
        
        function updateActiveRegion() {
            const cleanText = removeMarkerFromText(editor.value);
            const caret = editor.selectionStart;
            
             // Compute Active Region using v0.6 policy
             const region = computeActiveRegion(cleanText, caret);
             
             // Update visual active region overlay
             updateActiveRegionVisualization(cleanText, region);
             
             // Position marker at caret (it wants to close distance to caret)
            positionMarkerAtCaret(caret, cleanText);
            
            // Update status based on Active Region
            checkForCorrections(cleanText.slice(region.start, region.end));
            
            return { start: region.start, end: region.end, text: cleanText.slice(region.start, region.end) };
        }
        
        function checkForCorrections(regionText) {
            if (!regionText.trim()) {
                status.textContent = 'Ready for corrections...';
                return;
            }
            
            status.textContent = lmReady ? 'QWEN ready - corrections available on pause' : 'Starting LM worker...';
        }
        
        // v0.6 Native Marker Implementation
        // Marker becomes part of the text, travels through it, then restores original characters
        let markerPosition = -1; // Current position in text where marker is inserted
        let markerChar = '⠿'; // Current braille marker character
        
        function insertMarkerAtPosition(text, position) {
            if (position < 0 || position > text.length) return text;
            
            // Auto-cycle through marker symbols for animation effect
            currentMarkerIndex = (currentMarkerIndex + 1) % markerSymbols.length;
            currentMarkerSymbol = markerSymbols[currentMarkerIndex];
            
            return text.slice(0, position) + currentMarkerSymbol + text.slice(position);
        }
        
        function removeMarkerFromText(text) {
            // Remove any braille markers from text (all 16 symbols)
            return text.replace(/[⠀⠂⠄⠆⠐⠒⠔⠖⠠⠢⠤⠦⠰⠲⠴⠶]/g, '');
        }
        
        function updateMarkerInText(newPosition = -1) {
            if (!originalText) {
                originalText = removeMarkerFromText(editor.value);
            }
            
            // Store current caret position before modifying text
            const currentCaret = editor.selectionStart;
            
            // Remove marker from current position
            let cleanText = removeMarkerFromText(editor.value);
            
            // Insert marker at new position if valid
            if (newPosition >= 0 && newPosition <= cleanText.length) {
                markerPosition = newPosition;
                editor.value = insertMarkerAtPosition(cleanText, markerPosition);
                
                // Restore caret position, adjusting for marker insertion
                let adjustedCaret = currentCaret;
                if (newPosition <= currentCaret) {
                    adjustedCaret = currentCaret + 1; // Account for inserted marker
                }
                editor.selectionStart = adjustedCaret;
                editor.selectionEnd = adjustedCaret;
            } else {
                markerPosition = -1;
                editor.value = cleanText;
                
                // Restore original caret position
                editor.selectionStart = currentCaret;
                editor.selectionEnd = currentCaret;
            }
            
            // Update originalText to clean version
            originalText = cleanText;
            
            console.log(`[Marker] Updated marker at ${newPosition}, caret preserved/adjusted to ${editor.selectionStart}`);
        }
        
        function positionMarkerAtCaret(caret, text) {
            if (!text.trim()) {
                updateMarkerInText(-1); // Remove marker
                return;
            }
            
            // Position marker at caret (it "wants to close distance to caret")
            updateMarkerInText(caret);
            
            // Animate marker symbols
            animateMarkerSymbols();
        }
        
        function animateMarkerSymbols() {
            if (markerAnimationFrame) {
                cancelAnimationFrame(markerAnimationFrame);
            }
            
            function updateMarker() {
                if (markerPosition >= 0) {
                    markerChar = markerSymbols[currentMarkerIndex];
                    currentMarkerIndex = (currentMarkerIndex + 1) % markerSymbols.length;
                    
                    // Update the marker character in the text
                    const cleanText = removeMarkerFromText(editor.value);
                    if (markerPosition <= cleanText.length) {
                        editor.value = insertMarkerAtPosition(cleanText, markerPosition);
                    }
                }
                
                markerAnimationFrame = requestAnimationFrame(() => {
                    setTimeout(updateMarker, 200);
                });
            }
            
            updateMarker();
        }
        
        // v0.6 QWEN Model Integration (LM-Only Pipeline)
        // Based on: docs/06-guides/06-03-reference/three-stage-pipeline.md
        // Stage 1: Noise (typos, spacing) - LM inference, high confidence
        // Stage 2: Context (grammar, coherence) - LM with ±2 sentence window  
        // Stage 3: Tone (style) - LM style adjustment, default None
        
        // Removed direct model init; LM runs inside worker
        
        // ──────────────────────────────────────────────────────────────
        // LM Worker Bridge with Fallback (for debugging import issues)
        // ──────────────────────────────────────────────────────────────
        let lmWorker = null;
        let useFallback = true; // Default to fallback, only use real worker if it proves it works
        const pending = new Map(); // requestId -> {chunks: string[], startedAt}
        
        // Try to initialize worker, but keep fallback as default
        try {
            lmWorker = new Worker('/src/worker/lmWorker.ts', { type: 'module' });
            console.log('[LM] 🔄 Worker created, but staying on fallback until proven working');
            
            // LM Worker Error Handling
            lmWorker.onerror = (error) => {
                console.error('[LM] Worker failed to load:', error);
                console.log('[LM] 🔄 Staying on mock LM fallback');
                useFallback = true;
                lmWorker = null;
            };
        } catch (error) {
            console.error('[LM] Failed to create worker:', error);
            console.log('[LM] 🔄 Using mock LM fallback (worker creation failed)');
            useFallback = true;
        }
        
         // ──────────────────────────────────────────────────────────────
         // UNIVERSAL LM CAPABILITIES (Seven Scenarios Requirements)
         // ──────────────────────────────────────────────────────────────
         
         // Universal corrections covering all scenario requirements
         const UNIVERSAL_CORRECTIONS = {
             // Academic Excellence - transposition errors & scientific terms
             'resarch': 'research', 'anaylsis': 'analysis', 'hypotesis': 'hypothesis',
             'metodology': 'methodology', 'conculsion': 'conclusion', 'signifcant': 'significant',
             'experment': 'experiment', 'observaton': 'observation', 'varibles': 'variables',
             'protien': 'protein', 'mechaism': 'mechanism', 'diseas': 'disease',
             'investigaton': 'investigation', 'furthr': 'further', 'Alzheimers': "Alzheimer's",
             
             // Multilingual Professional - cross-language & keyboard mapping
             'finacial': 'financial', 'analisys': 'analysis', 'experincing': 'experiencing',
             'campain': 'campaign', 'performanc': 'performance', 'converison': 'conversion',
             'quater': 'quarter', 'exceded': 'exceeded', 'expecations': 'expectations',
             'incresed': 'increased',
             
             // Creative Flow - narrative & psychological terms
             'detectiv': 'detective', 'murdrer': 'murderer', 'victms': 'victims',
             'psycological': 'psychological', 'agianst': 'against', 'allong': 'along',
             'playn': 'plain', 'ben': 'been', 'realised': 'realised',
             
             // Speed Demon - phonetic shorthand & stenographic
             'defdnt': 'defendant', 'clamd': 'claimed', 'contrct': 'contract',
             'invld': 'invalid', 'mstk': 'mistake', 'tht': 'that', 'ws': 'was', 'du': 'due',
             
             // Data Whisperer - compressed notation
             'biot': 'biotech', 'phs2': 'Phase 2', 'trl': 'trial', 'fda': 'FDA',
             'aprvl': 'approval', 'hgh': 'high', 'rsk': 'risk', 'bg': 'big',
             'upsd': 'upside', 'unkwn': 'unknown', 'co': 'company',
             
             // Universal typos (all scenarios)
             'teh': 'the', 'brwon': 'brown', 'nto': 'not', 'taht': 'that',
             'recieve': 'receive', 'seperate': 'separate', 'occured': 'occurred',
             'thier': 'their', 'definately': 'definitely'
         };
         
         // Quality gates for correction validation
         const QUALITY_GATES = {
             minConfidence: 0.7,           // Minimum confidence for any correction
             maxLengthChange: 0.5,         // Max 50% length change
             preserveVoice: true,          // Preserve original writing voice
             academicAccuracy: 0.95,       // High accuracy for scientific terms
             professionalTone: true,       // Maintain professional standards
             accessibilityCompliant: true  // Screen reader compatible
         };
         
         // ──────────────────────────────────────────────────────────────
         // QUALITY GATES - Validation for all corrections
         // ──────────────────────────────────────────────────────────────
         
         function passesQualityGates(original, corrected, stage) {
             // Gate 1: No empty or identical corrections
             if (!corrected.trim() || corrected === original) {
                 return false;
             }
             
             // Gate 2: Length change validation (prevent over-expansion/contraction)
             const lengthChange = Math.abs(corrected.length - original.length) / original.length;
             if (lengthChange > QUALITY_GATES.maxLengthChange) {
                 console.log(`[QualityGate] Length change too large: ${(lengthChange * 100).toFixed(1)}%`);
                 return false;
             }
             
             // Gate 3: Confidence scoring based on known corrections
             const confidence = calculateCorrectionConfidence(original, corrected);
             if (confidence < QUALITY_GATES.minConfidence) {
                 console.log(`[QualityGate] Confidence too low: ${confidence.toFixed(2)}`);
                 return false;
             }
             
             // Gate 4: Voice preservation (creative writing protection)
             if (QUALITY_GATES.preserveVoice && hasVoiceDistortion(original, corrected)) {
                 console.log(`[QualityGate] Voice distortion detected`);
                 return false;
             }
             
             // Gate 5: Professional standards (accessibility & business requirements)
             if (QUALITY_GATES.professionalTone && !meetsProfessionalStandards(corrected)) {
                 console.log(`[QualityGate] Professional standards not met`);
                 return false;
             }
             
             console.log(`[QualityGate] ✅ All gates passed (confidence: ${confidence.toFixed(2)})`);
             return true;
         }
         
         function calculateCorrectionConfidence(original, corrected) {
             let confidence = 0.5; // Base confidence
             
             // Increase confidence for known corrections
             for (const [wrong, right] of Object.entries(UNIVERSAL_CORRECTIONS)) {
                 if (original.toLowerCase().includes(wrong.toLowerCase()) && 
                     corrected.toLowerCase().includes(right.toLowerCase())) {
                     confidence += 0.2;
                 }
             }
             
             // Increase confidence for common grammar fixes
             if (original.includes(' i ') && corrected.includes(' I ')) confidence += 0.1;
             if (/\s+/.test(original) && !/\s{2,}/.test(corrected)) confidence += 0.1;
             
             return Math.min(1.0, confidence);
         }
         
         function hasVoiceDistortion(original, corrected) {
             // Check for major structural changes that might alter creative voice
             const originalWords = original.split(/\s+/).length;
             const correctedWords = corrected.split(/\s+/).length;
             const wordCountChange = Math.abs(correctedWords - originalWords) / originalWords;
             
             // More than 30% word count change suggests voice alteration
             return wordCountChange > 0.3;
         }
         
         function meetsProfessionalStandards(text) {
             // Check for basic professional language standards
             const unprofessionalPatterns = /\b(gonna|wanna|gotta|dunno|kinda|sorta)\b/gi;
             return !unprofessionalPatterns.test(text);
         }
         
         // ──────────────────────────────────────────────────────────────
         // ACTIVE REGION VISUALIZATION - Shows current processing area
         // ──────────────────────────────────────────────────────────────
         
         function updateActiveRegionVisualization(text, region) {
             const overlay = document.getElementById('activeRegionOverlay');
             if (!overlay) return;
             
             // Create highlighted version of text
             let visualText = text;
             if (region.start < region.end) {
                 const beforeRegion = text.slice(0, region.start);
                 const regionText = text.slice(region.start, region.end);
                 const afterRegion = text.slice(region.end);
                 
                 visualText = beforeRegion + 
                     `<span class="active-region-highlight">${regionText}</span>` + 
                     afterRegion;
             }
             
             overlay.innerHTML = visualText;
             
             console.log(`[ActiveRegion] 🎯 Visualized region:`, {
                 start: region.start,
                 end: region.end,
                 text: text.slice(region.start, region.end),
                 wordCount: text.slice(region.start, region.end).split(/\s+/).length
             });
         }

        function startWorkerHeartbeat() {
            console.log('[QualityGate] 🚀 Starting LM heartbeat test...');
            
            if (useFallback || !lmWorker) {
                // Mock LM heartbeat
                console.log('[QualityGate] 🔄 Using mock LM for testing');
                status.textContent = 'Mock LM ready — start typing!';
                lmReady = true;
                
                // Test mock corrections
                const testInput = 'teh quick brwon fox';

        function extractContextWindow(text, regionStart, regionEnd) {
            // Extract ±2 sentences around the region for context
            const beforeText = text.slice(0, regionStart);
            const afterText = text.slice(regionEnd);

            const beforeSentences = beforeText.split(/[.!?]+/).filter(s => s.trim()).slice(-2);
            const afterSentences = afterText.split(/[.!?]+/).filter(s => s.trim()).slice(0, 2);

                before: beforeSentences.join('. ').trim(),
                after: afterSentences.join('. ').trim()
            };

            if (progress >= 1) return corrected;

            const targetLength = Math.floor(original.length + (corrected.length - original.length) * progress);
            const chars = Math.floor(corrected.length * progress);
            
            return corrected.slice(0, chars) + original.slice(chars, targetLength);

        // localStorage functions for marker settings
        function saveMarkerSettings() {
            const settings = {
                animationSpeed,
                // currentMarkerSymbol removed - auto-cycling through symbols
                version: '0.6'
            };
            localStorage.setItem('mindflow-marker-settings', JSON.stringify(settings));
        }
        
        function loadMarkerSettings() {
            try {
                const saved = localStorage.getItem('mindflow-marker-settings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    if (settings.version === '0.6') {
                        animationSpeed = settings.animationSpeed || 80;
                        // currentMarkerSymbol removed - auto-cycling through symbols
                        
                        // Update UI elements
                        animationSpeedSlider.value = animationSpeed;
                        animationSpeedValue.textContent = animationSpeed;
                        // Marker symbol loaded from storage
                        
                        // Marker symbol buttons removed - auto-cycling during animation
                        
                        console.log(`[MarkerControls] Loaded settings: speed=${animationSpeed}ms, auto-cycling symbols`);
                    }
                }
            } catch (error) {
                console.warn('[MarkerControls] Failed to load settings:', error);
            }
        }
        
        // Initialize QWEN model and setup
        async function initialize() {
            console.log('🚀 Initializing Mind⠶Flow v0.6...');
            
            // Load saved marker settings
            loadMarkerSettings();
            
            // Initialize the demo text
            originalText = removeMarkerFromText(editor.value);
            updateActiveRegion();
            
            // Start LM worker heartbeat (quality gate)
            startWorkerHeartbeat();
            
            console.log('✅ Mind⠶Flow v0.6 Demo Ready!');
            console.log('✅ QWEN LM pipeline integrated');
            console.log('✅ Active Region Policy active');
            console.log('✅ Native Correction Marker behavior');
            console.log('✅ Marker controls with localStorage persistence');
        }
        
        // Start initialization
        initialize();
    </script>
